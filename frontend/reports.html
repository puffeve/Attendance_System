<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Monthly Report</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">

  <!-- 🔙 BACK BUTTON -->
  <button class="nav-btn" onclick="goBack()">← Back</button>

  <div class="logo">HR Panel</div>

  <button class="nav-btn" onclick="location='hr-dashboard.html'">📊 Dashboard</button>
  <button class="nav-btn" onclick="location='employees.html'">👨‍💼 Employees</button>
  <button class="nav-btn" onclick="location='leave.html'">📝 Leave Approval</button>
  <button class="nav-btn active">📈 Reports</button>
  <button class="nav-btn logout" onclick="logout()">🚪 Logout</button>
</div>

<!-- ===== MAIN ===== -->
<div class="main">

<h1 class="page-title">Monthly Work Report</h1>

<!-- ===== KPI SUMMARY ===== -->
<div class="card-grid">

  <div class="stat-card">
    <div class="stat-icon blue">⏱</div>
    <div>
      <div class="stat-title">Total Work Minutes</div>
      <div class="stat-value" id="sumWork">0</div>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon green">🟢</div>
    <div>
      <div class="stat-title">Total OT Minutes</div>
      <div class="stat-value" id="sumOT">0</div>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon orange">🔴</div>
    <div>
      <div class="stat-title">Total Late Minutes</div>
      <div class="stat-value" id="sumLate">0</div>
    </div>
  </div>

</div>

<br>

<!-- ===== CHART ===== -->
<div class="chart-card">
  <canvas id="chart"></canvas>
</div>

</div>

<script>

/* ===== ROUTE PROTECT ===== */
if(localStorage.getItem("role")!=="hr"){
 alert("Access denied");
 location="login.html";
}

/* ===== LOAD REPORT ===== */
async function loadChart(){

 try{

  const res = await fetch('http://localhost:3000/api/report/monthly');
  const data = await res.json();

  if(!data.length){
    alert("No report data found");
    return;
  }

  // เรียงวันที่จากเก่า -> ใหม่
  data.sort((a,b)=> new Date(a.work_date) - new Date(b.work_date));

  // ===== SUMMARY CALCULATION =====
  let totalWork = 0;
  let totalOT = 0;
  let totalLate = 0;

  data.forEach(r=>{
    totalWork += Number(r.total_work || 0);
    totalOT += Number(r.total_ot || 0);
    totalLate += Number(r.total_late || 0);
  });

  document.getElementById("sumWork").innerText = totalWork;
  document.getElementById("sumOT").innerText = totalOT;
  document.getElementById("sumLate").innerText = totalLate;

  // ===== CHART =====
  const ctx=document.getElementById('chart');

  new Chart(ctx,{
    type:'bar',
    data:{
      labels:data.map(x=>x.work_date),
      datasets:[
        {
          label:'Work Minutes',
          data:data.map(x=>x.total_work),
          backgroundColor:'#2f80ed',
          borderRadius:6
        },
        {
          label:'OT Minutes',
          data:data.map(x=>x.total_ot),
          backgroundColor:'#27ae60',
          borderRadius:6
        },
        {
          label:'Late Minutes',
          data:data.map(x=>x.total_late),
          backgroundColor:'#eb5757',
          borderRadius:6
        }
      ]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{
          position:'top'
        }
      },
      scales:{
        y:{
          beginAtZero:true
        }
      }
    }
  });

 }catch(err){
  console.error(err);
  alert("โหลดรายงานไม่ได้");
 }

}

/* ===== NAV ===== */
function goBack(){
  window.history.back();
}

function logout(){
 localStorage.clear();
 location="login.html";
}

loadChart();

</script>

</body>
</html>
